app = "sugmona-huevo-endirbeast"          # change this: app names are global on Fly.io
primary_region = "iad"         # pick the region closest to your players

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
echo $SHELL
